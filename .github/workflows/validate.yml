name: Windows validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: windows-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ruff==0.17.1
      - run: python -m ruff check .
      - run: python -m unittest discover -v
  portable:
    runs-on: windows-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt
      - run: python -m PyInstaller --noconfirm PULSE.spec
      - run: python tools/package_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: PULSE-Windows-x64
          path: |
            release/PULSE-portable.zip
            release/SHA256SUMS.txt
